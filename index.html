
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 웹툰 작업실</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3f8;color:#25212b;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#292331;color:white;padding:24px 18px}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;color:#ddd3e7;font-size:14px}
main{padding:16px;max-width:760px;margin:auto}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
button{border:0;border-radius:10px;padding:11px 14px;background:#e5deed;color:#30283a;font-size:14px;font-weight:600}
button.active,.primary{background:#65449a;color:white}
.panel{background:white;border-radius:16px;padding:17px;margin-bottom:16px;box-shadow:0 2px 10px #2415360c}
h2{font-size:19px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd5e5;border-radius:9px;font-size:15px;background:white;color:#25212b}
textarea{min-height:85px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.item{border:1px solid #e7e0ed;border-radius:12px;padding:13px;margin-top:10px}
.item h3{margin:0 0 6px;font-size:16px}
.muted{color:#777080;font-size:13px}
.preview{width:100%;max-height:260px;object-fit:contain;border-radius:9px;margin-top:10px;background:#f4f0f7}
.empty{padding:18px;text-align:center;color:#82788e;font-size:14px}
footer{text-align:center;padding:18px;color:#82788e;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🎨 나만의 웹툰 작업실</h1>
<p>캐릭터를 정리하고, 컷을 만들고, 나만의 이야기를 완성해요.</p>
</header>
<main>
<nav>
<button class="active" data-tab="characters">캐릭터 도감</button>
<button data-tab="cuts">컷 관리</button>
<button data-tab="gallery">이미지 보관함</button>
</nav>

<section id="characters" class="tab">
<div class="panel">
<h2>캐릭터 등록</h2>
<label>캐릭터 이름</label><input id="charName" placeholder="예: 서연화">
<label>외모와 의상</label><textarea id="charLook" placeholder="머리 모양, 눈, 옷, 특징 등을 적어 주세요."></textarea>
<label>성격과 설정</label><textarea id="charStory" placeholder="성격, 능력, 과거 등"></textarea>
<label>대표 이미지</label><input id="charImage" type="file" accept="image/*">
<div class="actions"><button class="primary" id="saveChar">캐릭터 저장</button></div>
</div>
<div class="panel"><h2>등록된 캐릭터</h2><div id="charList" class="empty">아직 등록한 캐릭터가 없어요.</div></div>
</section>

<section id="cuts" class="tab" hidden>
<div class="panel">
<h2>웹툰 컷 등록</h2>
<label>회차</label><input id="episode" placeholder="예: 1화">
<label>컷 번호</label><input id="cutNumber" placeholder="예: 001">
<label>장면 설명</label><textarea id="cutScene" placeholder="예: 연화가 어두운 골목에서 악귀를 향해 달린다."></textarea>
<label>표정·동작·카메라 구도</label><textarea id="cutDirection" placeholder="예: 옆모습, 빠른 달리기, 낮은 카메라"></textarea>
<label>완성 이미지 첨부</label><input id="cutImage" type="file" accept="image/*">
<div class="actions"><button class="primary" id="saveCut">컷 저장</button></div>
</div>
<div class="panel"><h2>등록된 컷</h2><div id="cutList" class="empty">아직 등록한 컷이 없어요.</div></div>
</section>

<section id="gallery" class="tab" hidden>
<div class="panel">
<h2>이미지 보관함</h2>
<p class="muted">이 기기에서 선택한 이미지를 보관함에 추가할 수 있어요.</p>
<label>이미지 선택</label><input id="galleryFile" type="file" accept="image/*" multiple>
<div id="galleryList"></div>
</div>
</section>
<footer>첫 번째 시제품 · 자료를 잃지 않도록 원본 이미지도 따로 보관해 주세요.</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let chars=[],cuts=[],gallery=[];
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
document.querySelectorAll('.tab').forEach(x=>x.hidden=x.id!==b.dataset.tab);
});
function readImage(file){return new Promise(resolve=>{if(!file)return resolve('');const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file);});}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderChars(){$('charList').className=chars.length?'':'empty';$('charList').innerHTML=chars.length?chars.map((c,i)=>`<div class="item"><h3>${safe(c.name)}</h3><p>${safe(c.look)}</p><p>${safe(c.story)}</p>${c.image?`<img class="preview" src="${c.image}">`:''}<button data-del-char="${i}">삭제</button></div>`).join(''):'아직 등록한 캐릭터가 없어요.';}
function renderCuts(){$('cutList').className=cuts.length?'':'empty';$('cutList').innerHTML=cuts.length?cuts.map((c,i)=>`<div class="item"><h3>${safe(c.ep)} · 컷 ${safe(c.num)}</h3><p>${safe(c.scene)}</p><p>${safe(c.direction)}</p>${c.image?`<img class="preview" src="${c.image}">`:''}<button data-del-cut="${i}">삭제</button></div>`).join(''):'아직 등록한 컷이 없어요.';}
$('saveChar').onclick=async()=>{const name=$('charName').value.trim();if(!name){alert('캐릭터 이름을 입력해 주세요.');return;}const image=await readImage($('charImage').files[0]);chars.push({name,look:$('charLook').value,story:$('charStory').value,image});localStorage.setItem('ys_chars',JSON.stringify(chars));renderChars();$('charName').value='';$('charLook').value='';$('charStory').value='';$('charImage').value='';};
$('saveCut').onclick=async()=>{const num=$('cutNumber').value.trim();if(!num){alert('컷 번호를 입력해 주세요.');return;}const image=await readImage($('cutImage').files[0]);cuts.push({ep:$('episode').value||'1화',num,scene:$('cutScene').value,direction:$('cutDirection').value,image});renderCuts();$('cutNumber').value='';$('cutScene').value='';$('cutDirection').value='';$('cutImage').value='';};
document.addEventListener('click',e=>{if(e.target.dataset.delChar!==undefined){chars.splice(Number(e.target.dataset.delChar),1);renderChars();}if(e.target.dataset.delCut!==undefined){cuts.splice(Number(e.target.dataset.delCut),1);renderCuts();}});
$('galleryFile').onchange=async e=>{for(const file of e.target.files){const src=await readImage(file);gallery.push({name:file.name,src});} $('galleryList').innerHTML=gallery.map((g,i)=>`<div class="item"><p>${safe(g.name)}</p><img class="preview" src="${g.src}"><button data-del-gallery="${i}">삭제</button></div>`).join('');};
document.addEventListener('click',e=>{if(e.target.dataset.delGallery!==undefined){gallery.splice(Number(e.target.dataset.delGallery),1);$('galleryList').innerHTML=gallery.map((g,i)=>`<div class="item"><p>${safe(g.name)}</p><img class="preview" src="${g.src}"><button data-del-gallery="${i}">삭제</button></div>`).join('');}});
</script>
</body>
</html>
