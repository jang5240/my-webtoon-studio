
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야행 스튜디오</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121a;color:#f4f4f7;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#1a1d29}
h1{margin:0 0 8px;font-size:27px}
header p{margin:0;color:#c2c5d4;font-size:14px}
main{max-width:850px;margin:auto;padding:15px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
button{border:0;border-radius:8px;padding:11px 13px;cursor:pointer;font-size:14px}
nav button{background:#292d3d;color:white}
nav button.active,.primary{background:#7565e8;color:white}
section{display:none}
section.active{display:block}
.panel,.item{background:#1a1d29;border:1px solid #363a4c;border-radius:12px;padding:15px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 14px}
h3{margin:0 0 10px}
label{display:block;margin:12px 0 6px;font-size:14px;color:#c9ccda}
input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #44495e;background:#10121a;color:white;font-size:15px}
textarea{min-height:75px;resize:vertical}
.item p{white-space:pre-wrap;color:#d2d5e0}
.preview{display:block;width:100%;max-height:350px;object-fit:contain;margin-top:10px;border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.delete{background:#4b303b;color:white}
.empty{color:#a9aec0;padding:12px 0}
.note{font-size:12px;color:#a9aec0;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>🌙 야행 스튜디오</h1>
  <p>나만의 웹툰 캐릭터와 장면을 관리하는 공간</p>
</header>

<main>
<nav>
  <button class="active" data-tab="characters">캐릭터 도감</button>
  <button data-tab="cuts">컷 관리</button>
  <button data-tab="gallery">이미지 보관함</button>
</nav>

<section id="characters" class="active">
  <div class="panel">
    <h2>캐릭터 등록</h2>
    <label for="charName">캐릭터 이름 *</label>
    <input id="charName" placeholder="예: 서연화">
    <label for="charLook">외형 및 복장</label>
    <textarea id="charLook" placeholder="머리 모양, 눈 색, 옷 등"></textarea>
    <label for="charStory">성격 및 설정</label>
    <textarea id="charStory" placeholder="캐릭터의 성격과 과거"></textarea>
    <label for="charImage">캐릭터 이미지</label>
    <input id="charImage" type="file" accept="image/*">
    <button class="primary" id="saveChar">캐릭터 저장</button>
  </div>
  <h2>등록된 캐릭터</h2>
  <div id="charList"></div>
</section>

<section id="cuts">
  <div class="panel">
    <h2>웹툰 컷 등록</h2>
    <label for="episode">회차</label>
    <input id="episode" value="1화">
    <label for="cutNumber">컷 번호 *</label>
    <input id="cutNumber" placeholder="예: 1">
    <label for="cutScene">장면 설명</label>
    <textarea id="cutScene" placeholder="이 컷에서 일어나는 일"></textarea>
    <label for="cutDirection">연출 및 카메라</label>
    <textarea id="cutDirection" placeholder="클로즈업, 전신, 액션 등"></textarea>
    <label for="cutImage">컷 이미지</label>
    <input id="cutImage" type="file" accept="image/*">
    <button class="primary" id="saveCut">컷 저장</button>
  </div>
  <h2>등록된 컷</h2>
  <div id="cutList"></div>
</section>

<section id="gallery">
  <div class="panel">
    <h2>이미지 보관함</h2>
    <label for="galleryFile">이미지 선택</label>
    <input id="galleryFile" type="file" accept="image/*" multiple>
    <p class="note">이미지는 이 브라우저에 저장됩니다. 기기 저장 공간에 따라 보관 가능한 양이 제한될 수 있어요.</p>
  </div>
  <div id="galleryList"></div>
</section>
</main>

<footer>야행 스튜디오 · 개인 웹툰 작업 공간</footer>

<script>
const $ = id => document.getElementById(id);

function load(key){
  try{return JSON.parse(localStorage.getItem(key)||'[]')}
  catch(e){return []}
}

let chars=load('ys_chars');
let cuts=load('ys_cuts');
let gallery=load('ys_gallery');

function persist(key,data){
  try{
    localStorage.setItem(key,JSON.stringify(data));
    return true;
  }catch(e){
    alert('저장 공간이 부족해요. 이미지 용량을 줄여 다시 시도해 주세요.');
    return false;
  }
}

function safe(value){
  return String(value||'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    if(!file)return resolve('');
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('이미지를 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}

function renderChars(){
  $('charList').innerHTML=chars.length?chars.map((c,i)=>`
    <div class="item">
      <h3>${safe(c.name)}</h3>
      <p>${safe(c.look)}</p>
      <p>${safe(c.story)}</p>
      ${c.image?`<img class="preview" src="${c.image}" alt="캐릭터 이미지">`:''}
      <div class="actions">
        <button class="delete" data-del-char="${i}">삭제</button>
      </div>
    </div>`).join(''):'<p class="empty">아직 등록된 캐릭터가 없어요.</p>';
}

function renderCuts(){
  $('cutList').innerHTML=cuts.length?cuts.map((c,i)=>`
    <div class="item">
      <h3>${safe(c.ep)} · 컷 ${safe(c.num)}</h3>
      <p>${safe(c.scene)}</p>
      <p>${safe(c.direction)}</p>
      ${c.image?`<img class="preview" src="${c.image}" alt="웹툰 컷">`:''}
      <div class="actions">
        <button class="delete" data-del-cut="${i}">삭제</button>
      </div>
    </div>`).join(''):'<p class="empty">아직 등록된 컷이 없어요.</p>';
}

function renderGallery(){
  $('galleryList').innerHTML=gallery.length?gallery.map((g,i)=>`
    <div class="item">
      <p>${safe(g.name)}</p>
      <img class="preview" src="${g.image}" alt="${safe(g.name)}">
      <button class="delete" data-del-gallery="${i}">삭제</button>
    </div>`).join(''):'<p class="empty">보관된 이미지가 없어요.</p>';
}

$('saveChar').onclick=async()=>{
  const name=$('charName').value.trim();
  if(!name){alert('캐릭터 이름을 입력해 주세요.');return;}
  try{
    const image=await readImage($('charImage').files[0]);
    const next=[...chars,{name,look:$('charLook').value,story:$('charStory').value,image}];
    if(!persist('ys_chars',next))return;
    chars=next;
    renderChars();
    $('charName').value='';
    $('charLook').value='';
    $('charStory').value='';
    $('charImage').value='';
  }catch(e){alert('이미지를 읽지 못했어요. 다시 시도해 주세요.');}
};

$('saveCut').onclick=async()=>{
  const num=$('cutNumber').value.trim();
  if(!num){alert('컷 번호를 입력해 주세요.');return;}
  try{
    const image=await readImage($('cutImage').files[0]);
    const next=[...cuts,{
      ep:$('episode').value.trim()||'1화',
      num,scene:$('cutScene').value,
      direction:$('cutDirection').value,image
    }];
    if(!persist('ys_cuts',next))return;
    cuts=next;
    renderCuts();
    $('cutNumber').value='';
    $('cutScene').value='';
    $('cutDirection').value='';
    $('cutImage').value='';
  }catch(e){alert('이미지를 읽지 못했어요. 다시 시도해 주세요.');}
};

$('galleryFile').onchange=async()=>{
  const files=Array.from($('galleryFile').files||[]);
  try{
    const additions=[];
    for(const file of files){
      additions.push({name:file.name,image:await readImage(file)});
    }
    const next=[...gallery,...additions];
    if(!persist('ys_gallery',next))return;
    gallery=next;
    renderGallery();
    $('galleryFile').value='';
  }catch(e){alert('이미지를 읽지 못했어요.');}
};

document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;

  if(b.dataset.tab){
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('main section').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    $(b.dataset.tab).classList.add('active');
  }

  if(b.dataset.delChar!==undefined){
    const next=chars.filter((_,i)=>i!==Number(b.dataset.delChar));
    if(!persist('ys_chars',next))return;
    chars=next;renderChars();
  }

  if(b.dataset.delCut!==undefined){
    const next=cuts.filter((_,i)=>i!==Number(b.dataset.delCut));
    if(!persist('ys_cuts',next))return;
    cuts=next;renderCuts();
  }

  if(b.dataset.delGallery!==undefined){
    const next=gallery.filter((_,i)=>i!==Number(b.dataset.delGallery));
    if(!persist('ys_gallery',next))return;
    gallery=next;renderGallery();
  }
});

renderChars();
renderCuts();
renderGallery();
</script>
</body>
</html>
